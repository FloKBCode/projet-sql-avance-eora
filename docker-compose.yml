services:
  db:
    image: postgres:16
    container_name: eora-db
    environment:
      POSTGRES_USER: eora
      POSTGRES_PASSWORD: eora
      POSTGRES_DB: projet
    ports:
      - "5433:5432"
    volumes:
      - ./projet.sql:/docker-entrypoint-initdb.d/1-projet.sql:ro
      - ./site/api/acces.sql:/docker-entrypoint-initdb.d/2-acces.sql:ro
      - ./demo.sql:/projet/demo.sql:ro
      - donnees:/var/lib/postgresql/data

volumes:
  donnees:
